name: Test TIER0 release braches

on:
  pull_request:
    branches: ["release-*"]
    paths-ignore:
      - "**.md"
  push:
    branches: ["release-*"]
    paths-ignore:
      - "**.md"

jobs:
  test-tier0:
    uses: konveyor/ci/.github/workflows/global-ci.yml@main
    with:
      tag: ${{ github.base_ref || github.ref_name }} # Use the target branch: base_ref for PRs (empty for push), fallback to ref_name for pushes
      operator_tag: ${{ github.base_ref || github.ref_name }}
      api_tests_ref: ${{ github.ref }} # The source branch being tested: PR source branch for PRs, pushed branch for pushes
      api_tests_tiers: DEBUG=1 make test-tier0
      run_api_tests: true
      run_ui_tests: false
      api_hub_tests_ref: ${{ github.base_ref || github.ref_name }}
